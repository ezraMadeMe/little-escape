spring.application.name=backend

# Server Configuration
server.port=8080

# Database Configuration (PostgreSQL - Supabase)
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?user=postgres.ryvhdetcwjzogtrvjwqs&password=0bHyyFyPB4LPlIqs&prepareThreshold=0
spring.datasource.username=postgres
spring.datasource.password=0bHyyFyPB4LPlIqs
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration for Supabase Transaction Pooler
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization
spring.sql.init.mode=always

# Actuator Configuration
management.endpoints.web.exposure.include=health,info

